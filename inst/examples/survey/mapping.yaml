schema_version: "1.0.0"
catalogues:
  source: {configuration: source, catalogue: code_lists, lookup: id}
  target: {configuration: target, catalogue: code_lists, lookup: code}
mappings:
  stations:
    source:
      table: stations
    file: correspondences/stations.csv
  observers:
    - source:
        table: observers
        property: name
      lookup: name
      property: code
    - source:
        table: observers
        lookup: name
      lookup: name
      property: code
