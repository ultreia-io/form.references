    navbar: Guides
    contents: [terminology, form.references]
navbar:
  structure:
    left: [intro, reference, articles, news, coverage, community]
    right: [search, github, lightswitch]
  components:
    articles:
      text: Articles
      menu:
        - text: Terminology
          href: articles/terminology.html
        - text: Getting started
          href: articles/form.references.html
    coverage:
      text: Coverage
      href: https://app.codecov.io/gh/ultreia-io/form.references
    intro:
      text: Getting started
      href: articles/form.references.html
    community:
      text: Community
      menu:
        - text: Contributing
          href: CONTRIBUTING.html
        - text: Maintainer guide
          href: DEVELOPMENT.html
        - text: Security policy
          href: SECURITY.html
        - text: Code of conduct
          href: CODE_OF_CONDUCT.html
# Avoid repository-discovery HTTP requests; all navigation links are explicit.
home:
  sidebar: false
news:
  cran_dates: false

footer:
