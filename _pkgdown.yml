url: https://ultreia-io.github.io/form.references/
template:
  bootstrap: 5
  light-switch: true
reference:
  - title: Source configuration
    contents: [reference_schema, read_reference_configuration, reference_source, print.reference_source]
  - title: Catalogue tables
    contents: [read_reference_catalogue, get_reference_tables, prepare_model_references]
  - title: Shared lookups
    contents: [resolve_reference_lookups, reference_index, reference_match_rows, normalized_name_key]
  - title: Package
    contents: [form.references-package]
articles:
