url: https://ultreia-io.github.io/form.references/
template:
  bootstrap: 5
  light-switch: true
reference:
  - title: Source configuration
    contents: [reference_source, reference_source_from_yaml, print.reference_source]
  - title: Code lists
    contents: [read_code_list_catalogue, get_form_code_lists, get_code_lists]
  - title: Registries
    contents: [read_registry_catalogue, get_form_registries, get_registries]
  - title: Package
    contents: [form.references-package]
articles:
  - title: Guides
    navbar: Guides
    contents: [form.references]
  - title: Development
    contents: [articles/coverage]
navbar:
  structure:
    left: [intro, reference, articles, news, coverage, community]
    right: [search, github, lightswitch]
  components:
    articles:
      text: Articles
      menu:
        - text: Get started
          href: articles/form.references.html
    coverage:
      text: Coverage
      href: articles/coverage.html
    intro:
      text: Get started
      href: articles/form.references.html
    community:
      text: Community
      menu:
        - text: Contributing
          href: CONTRIBUTING.html
        - text: Maintainer guide
          href: DEVELOPMENT.html
        - text: Security policy
          href: SECURITY.html
        - text: Code of conduct
          href: CODE_OF_CONDUCT.html
# Avoid repository-discovery HTTP requests; all navigation links are explicit.
home:
  sidebar: false
news:
  cran_dates: false

footer:
  structure:
    left: [company, copyright, license]
    right: built_with
  components:
    company: "[ultreia.io](https://ultreia.io/)"
    copyright: "· © 2026"
    license: "· [License: LGPL-2.1](https://github.com/ultreia-io/form.references/blob/main/LICENSE)"
